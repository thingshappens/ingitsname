name: Set Worker secrets (one-off)

# Restore ELEVENLABS_API_KEY on the live "hsc" Worker from HSC_BULK_SECRETS (only that key). Prints no values.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          BULK: ${{ secrets.HSC_BULK_SECRETS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          umask 077
          printf %s "$BULK" | jq '{ELEVENLABS_API_KEY} | with_entries(.value |= (. // "" | gsub("\\s";"")))' > "$RUNNER_TEMP/s.json"
          len=$(jq -r '.ELEVENLABS_API_KEY|length' "$RUNNER_TEMP/s.json")
          echo "ELEVENLABS_API_KEY length in bulk: $len"
          [ "$len" -gt 0 ] || { echo "Not in HSC_BULK_SECRETS. Nothing written."; rm -f "$RUNNER_TEMP/s.json"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "xi-api-key: $(jq -r .ELEVENLABS_API_KEY "$RUNNER_TEMP/s.json")" https://api.elevenlabs.io/v1/voices)
          echo "ElevenLabs /v1/voices with this key: HTTP $code"
          [ "$code" = 200 ] || { echo "Key rejected by ElevenLabs. Nothing written."; rm -f "$RUNNER_TEMP/s.json"; exit 1; }
          npx --yes wrangler@4.136.3 secret bulk "$RUNNER_TEMP/s.json" --name hsc
          rm -f "$RUNNER_TEMP/s.json"
