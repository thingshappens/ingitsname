name: Set Worker secrets (one-off)

# Diagnostic only: lists recent Paddle SANDBOX transactions (access tokens masked). Sets nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
    steps:
      - name: Recent sandbox transactions
        run: |
          code=$(curl -sg -o tx.json -w '%{http_code}' -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/transactions?order_by=created_at[DESC]&per_page=5")
          echo "GET /transactions: $code"
          jq -r '.data[] | "\(.created_at) \(.id) status=\(.status) product=\(.custom_data.product // "-") url=\(.checkout.url // "-" | gsub("access=[0-9a-f]+";"access=<masked>"))"' tx.json
          rm -f tx.json
      - name: Reproduce The Edit transaction create (sandbox draft, never paid)
        env:
          PADDLE_PRICE_THE_EDIT_4: ${{ secrets.PADDLE_PRICE_THE_EDIT_4 }}
        run: |
          body=$(jq -n --arg p "$PADDLE_PRICE_THE_EDIT_4" '{items:[{price_id:$p,quantity:1}],custom_data:{order_id:"00000000-0000-4000-8000-000000000000",product:"the_edit_diag"},checkout:{url:"https://hautesoundcouture.com/edit/?order=00000000-0000-4000-8000-000000000000#access=0000"}}')
          code=$(curl -sg -o tx.json -w '%{http_code}' -X POST -H "Authorization: Bearer $PADDLE_API_KEY" -H 'content-type: application/json' -d "$body" https://sandbox-api.paddle.com/transactions)
          echo "POST /transactions: $code"
          jq -c '{error:.error, status:.data.status, url:.data.checkout.url}' tx.json
          rm -f tx.json
