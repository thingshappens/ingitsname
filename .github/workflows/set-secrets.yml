name: Set Worker secrets (one-off)

# Manual only. Copies the HSC_OWNER_CODE repo secret onto the "hsc" Worker (the
# Cloudflare account CLOUDFLARE_API_TOKEN deploys to). Touches nothing else. Prints names only.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HSC_OWNER_CODE: ${{ secrets.HSC_OWNER_CODE }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload secret
        run: |
          [ -n "$(printf %s "$HSC_OWNER_CODE" | tr -d '[:space:]')" ] || { echo "missing repo secret: HSC_OWNER_CODE"; exit 1; }
          umask 077
          jq -n '{HSC_OWNER_CODE:env.HSC_OWNER_CODE}' > secrets.json
          node -e "const d=require('./secrets.json');console.log('names:',Object.keys(d).sort().join(', '))"
          npx --yes wrangler@4.136.3 secret bulk secrets.json --name hsc
          rm -f secrets.json
