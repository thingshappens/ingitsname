name: Set Worker secrets (one-off)

# Diagnostic only: follows one Paddle SANDBOX transaction to The Edit order status.
# Prints statuses only; the order access token is never printed. Sets nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
      TXN: txn_01m3cddj85zxc7syd12p6a0tp2
    steps:
      - name: Follow order
        run: |
          code=$(curl -sg -o tx.json -w '%{http_code}' -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/transactions/$TXN")
          echo "sandbox GET /transactions/<txn>: $code"
          jq -r '.data | "txn status=\(.status) product=\(.custom_data.product) order=\(.custom_data.order_id) billed=\(.billed_at)"' tx.json
          code=$(curl -sg -o n.json -w '%{http_code}' -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/notifications?transaction_id=$TXN&per_page=20")
          echo "sandbox GET /notifications: $code"
          jq -r '.data[] | "\(.type) status=\(.status) attempts=\(.times_attempted) last=\(.last_attempt_at)"' n.json
          url=$(jq -r '.data.checkout.url' tx.json); rm -f tx.json n.json
          order=$(printf %s "$url" | sed -nE 's/.*order=([0-9a-f-]{36}).*/\1/p'); access=$(printf %s "$url" | sed -nE 's/.*access=([0-9a-f]+).*/\1/p')
          echo "::add-mask::$access"
          for i in $(seq 1 20); do
            curl -s -X POST 'https://hautesoundcouture.com/api/the-edit?action=status' -H 'content-type: application/json' -d "{\"orderId\":\"$order\",\"accessToken\":\"$access\"}" > s.json
            line=$(jq -c '{status,error,cuts:[.cuts[]?|.renderStatus]}' s.json); echo "$(date -u +%H:%M:%S) $line"
            s=$(jq -r .status s.json); [ "$s" = ready ] || [ "$s" = failed ] && break
            sleep 30
          done
          rm -f s.json
