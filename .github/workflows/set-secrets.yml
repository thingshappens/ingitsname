name: Set Worker secrets (one-off)

# Diagnostic: inspect The Edit's RunPod endpoint and workers. Changes nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - env:
          RP: ${{ secrets.THE_EDIT_RUNPOD_API_KEY }}
        run: |
          RP=$(printf %s "$RP" | tr -d '[:space:]')
          echo "== endpoints"; curl -s -H "Authorization: Bearer $RP" 'https://rest.runpod.io/v1/endpoints?includeWorkers=true&includeTemplate=true' | jq -c '.[]? | {id,name,gpuTypeIds,gpuCount,workersMin,workersMax,idleTimeout,executionTimeoutMs,networkVolumeId,dataCenterIds,template:{imageName:.template.imageName,env:(.template.env|keys?)},workers:[.workers[]?|{id,desiredStatus,gpu:.machine.gpuTypeId,dc:.machine.dataCenterId}]}' ; echo; curl -s -H "Authorization: Bearer $RP" 'https://rest.runpod.io/v1/endpoints' | jq -c 'if type=="object" then . else empty end'
          for id in $(curl -s -H "Authorization: Bearer $RP" 'https://rest.runpod.io/v1/endpoints' | jq -r '.[]?.id'); do echo "== health $id"; curl -s -H "Authorization: Bearer $RP" "https://api.runpod.ai/v2/$id/health"; echo; done
          echo "== volumes"; curl -s -H "Authorization: Bearer $RP" 'https://rest.runpod.io/v1/networkvolumes' | jq -c '.[]? | {id,name,size,dataCenterId}'
