name: Set Worker secrets (one-off)

# Diagnostic: tail Worker logs while requesting one live preview. Changes nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tail + preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          (timeout 150 npx --yes wrangler@4.136.3 tail hsc --format json > tail.json 2>tail.err &)
          sleep 25
          curl -s -o out.bin -w 'preview %{http_code} %{size_download}B\n' --max-time 120 -X POST 'https://hautesoundcouture.com/api/the-edit?action=preview' -H 'origin: https://hautesoundcouture.com' -H 'content-type: application/json' -d '{"phrase":"Make the room move.","voiceId":"monsieur_lousive","bpm":128,"cut":{"style":"flat_tag"}}'
          head -c 200 out.bin; echo
          sleep 15
          jq -c 'select(.event.request.url? // "" | test("preview")) | {outcome, exceptions, logs: [.logs[]?.message]}' tail.json | cut -c1-3000 || true
          tail -5 tail.err
