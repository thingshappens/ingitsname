name: Set Worker secrets (one-off)

# Go live: verify the live Paddle values in repo secrets, then copy them to the "hsc" Worker.
# Prints only check results, never values. Writes nothing if any check fails.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live values
        env:
          K: ${{ secrets.PADDLE_API_KEY }}
          T: ${{ secrets.PADDLE_CLIENT_TOKEN }}
          P: ${{ secrets.PADDLE_PRICE_THE_EDIT_4 }}
          W: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
        run: |
          set -eu
          ok=1
          chk(){ if [ "$2" = 1 ]; then echo "PASS $1"; else echo "FAIL $1"; ok=0; fi; }
          K=$(printf %s "$K" | tr -d '[:space:]'); T=$(printf %s "$T" | tr -d '[:space:]'); P=$(printf %s "$P" | tr -d '[:space:]'); W=$(printf %s "$W" | tr -d '[:space:]')
          chk "api key has live prefix" $(case "$K" in pdl_live_*) echo 1;; *) echo 0;; esac)
          chk "client token has live prefix" $(case "$T" in live_*) echo 1;; *) echo 0;; esac)
          chk "price id looks like pri_" $(case "$P" in pri_*) echo 1;; *) echo 0;; esac)
          chk "webhook secret is not a destination id" $(case "$W" in ntfset_*|"") echo 0;; *) echo 1;; esac)
          price=$(curl -s -H "Authorization: Bearer $K" "https://api.paddle.com/prices/$P")
          echo "$price" | jq -r '"price: status=\(.data.status) amount=\(.data.unit_price.amount) \(.data.unit_price.currency_code) recurring=\(.data.billing_cycle!=null) error=\(.error.code // "none")"'
          chk "price exists in live account and is active" $(echo "$price" | jq -r 'if .data.status=="active" then 1 else 0 end')
          ns=$(curl -s -H "Authorization: Bearer $K" "https://api.paddle.com/notification-settings")
          echo "$ns" | jq -r '.error.code // empty'
          echo "$ns" | jq -r '.data[]? | "destination: active=\(.active) url_matches=\(.destination=="https://hautesoundcouture.com/api/the-edit?action=webhook") events=\([.subscribed_events[].name]|map(select(.=="transaction.completed" or .=="transaction.paid"))|join(","))"'
          m=$(echo "$ns" | jq -r --arg w "$W" '[.data[]? | select(.active and .destination=="https://hautesoundcouture.com/api/the-edit?action=webhook" and .endpoint_secret_key==$w and ([.subscribed_events[].name]|index("transaction.completed")) and ([.subscribed_events[].name]|index("transaction.paid")))]|length')
          chk "webhook secret matches an active destination with both events" $([ "${m:-0}" -ge 1 ] && echo 1 || echo 0)
          [ "$ok" = 1 ] || { echo "Stopping: nothing was written to the site."; exit 1; }
          umask 077
          jq -n --arg k "$K" --arg t "$T" --arg p "$P" --arg w "$W" '{PADDLE_API_KEY:$k,PADDLE_CLIENT_TOKEN:$t,PADDLE_PRICE_THE_EDIT_4:$p,PADDLE_WEBHOOK_SECRET:$w,PADDLE_ENVIRONMENT:"production"}' > "$RUNNER_TEMP/s.json"
      - name: Copy to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.136.3 secret bulk "$RUNNER_TEMP/s.json" --name hsc
          rm -f "$RUNNER_TEMP/s.json"
