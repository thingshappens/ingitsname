name: Set Worker secrets (one-off)

# Diagnostic only: end-to-end Paddle SANDBOX purchase of The Edit via the real UI. Sets nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
      - name: E2E sandbox purchase
        env:
          HSC_OWNER_CODE: ${{ secrets.HSC_OWNER_CODE }}
        run: mkdir -p shots && node scripts/e2e-sandbox-purchase.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
