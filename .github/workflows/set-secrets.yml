name: Set Worker secrets (one-off)

# Atelier on Paddle: look up the live Atelier price IDs (by amount + product) and set them on the Worker,
# plus ATELIER_PAYMENT_PROVIDER=paddle. Stops without writing if the prices aren't found exactly once.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find live Atelier prices
        env:
          K: ${{ secrets.PADDLE_API_KEY }}
        run: |
          set -eu
          K=$(printf %s "$K" | tr -d '[:space:]')
          all=$(curl -s -H "Authorization: Bearer $K" 'https://api.paddle.com/prices?status=active&per_page=100&product_id=pro_01m35pdsk105q1mntkppkxm963')
          four=$(echo "$all" | jq -r '[.data[] | select(.unit_price.amount=="1200" and .unit_price.currency_code=="USD" and .billing_cycle==null)] | if length==1 then .[0].id else "" end')
          pack=$(echo "$all" | jq -r '[.data[] | select(.unit_price.amount=="3900" and .unit_price.currency_code=="USD" and .billing_cycle==null)] | if length==1 then .[0].id else "" end')
          echo "four=$four pack=$pack"
          [ -n "$four" ] && [ -n "$pack" ] || { echo "Stopping: prices not found exactly once. Nothing written."; exit 1; }
          umask 077
          jq -n --arg f "$four" --arg p "$pack" '{PADDLE_PRICE_ATELIER_4:$f,PADDLE_PRICE_ATELIER_PACK:$p,ATELIER_PAYMENT_PROVIDER:"paddle"}' > "$RUNNER_TEMP/s.json"
      - name: Copy to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.136.3 secret bulk "$RUNNER_TEMP/s.json" --name hsc
          rm -f "$RUNNER_TEMP/s.json"
