name: Set Worker secrets (one-off)

# Restore ELEVENLABS_API_KEY on the live "hsc" Worker from the ELEVENLABS_API_KEY repo secret (only that key). Prints no values.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          umask 077
          jq -n --arg k "$(printf %s "$KEY" | tr -d '[:space:]')" '{ELEVENLABS_API_KEY:$k}' > "$RUNNER_TEMP/s.json"
          len=$(jq -r '.ELEVENLABS_API_KEY|length' "$RUNNER_TEMP/s.json")
          echo "ELEVENLABS_API_KEY length in repo secret: $len"
          [ "$len" -gt 0 ] || { echo "Repo secret ELEVENLABS_API_KEY not set. Nothing written."; rm -f "$RUNNER_TEMP/s.json"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "xi-api-key: $(jq -r .ELEVENLABS_API_KEY "$RUNNER_TEMP/s.json")" https://api.elevenlabs.io/v1/voices)
          echo "ElevenLabs /v1/voices with this key: HTTP $code"
          [ "$code" = 200 ] || { echo "Key rejected by ElevenLabs. Nothing written."; rm -f "$RUNNER_TEMP/s.json"; exit 1; }
          npx --yes wrangler@4.136.3 secret bulk "$RUNNER_TEMP/s.json" --name hsc
          rm -f "$RUNNER_TEMP/s.json"
