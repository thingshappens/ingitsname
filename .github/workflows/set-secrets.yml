name: Set Worker secrets (one-off)

# Diagnostic: run the preview handler off-site with real settings and print the real error. Changes nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - env:
          BULK: ${{ secrets.HSC_BULK_SECRETS }}
          RP: ${{ secrets.THE_EDIT_RUNPOD_API_KEY }}
        run: node scripts/diag-preview.js
