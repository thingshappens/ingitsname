name: Set Worker secrets (one-off)

# Manual only. Sets The Edit's Paddle SANDBOX + RunPod secrets on the "hsc"
# Worker in the Cloudflare account that serves hautesoundcouture.com (the same
# account CLOUDFLARE_API_TOKEN deploys to), then verifies them. Prints names and
# HTTP status codes only — never values.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
      PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
      PADDLE_PRICE_THE_EDIT_4: ${{ secrets.PADDLE_PRICE_THE_EDIT_4 }}
      THE_EDIT_RUNPOD_API_KEY: ${{ secrets.THE_EDIT_RUNPOD_API_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inputs (sandbox only)
        run: |
          fail=0
          for n in PADDLE_API_KEY PADDLE_WEBHOOK_SECRET PADDLE_PRICE_THE_EDIT_4 THE_EDIT_RUNPOD_API_KEY; do
            [ -n "${!n}" ] || { echo "missing repo secret: $n"; fail=1; }
          done
          case "$PADDLE_API_KEY" in pdl_sdbx_*) ;; *) echo "PADDLE_API_KEY is not a sandbox key"; fail=1;; esac
          case "$PADDLE_PRICE_THE_EDIT_4" in pri_*) ;; *) echo "PADDLE_PRICE_THE_EDIT_4 is not a pri_ id"; fail=1;; esac
          exit $fail
      - name: Verify Paddle sandbox key + price
        run: |
          code=$(curl -s -o price.json -w '%{http_code}' -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/prices/$PADDLE_PRICE_THE_EDIT_4")
          echo "sandbox GET /prices/<id>: $code"
          [ "$code" = 200 ] && jq -r '.data | "price status=\(.status) amount=\(.unit_price.amount) \(.unit_price.currency_code) description=\(.description)"' price.json
          rm -f price.json
          [ "$code" = 200 ]
      - name: Paddle sandbox webhook destinations (informational)
        run: |
          code=$(curl -s -o ns.json -w '%{http_code}' -H "Authorization: Bearer $PADDLE_API_KEY" https://sandbox-api.paddle.com/notification-settings)
          echo "sandbox GET /notification-settings: $code"
          [ "$code" = 200 ] && jq -r '.data[] | "\(.destination) active=\(.active) events=\([.subscribed_events[].name] | join(","))"' ns.json || true
          rm -f ns.json
      - name: Verify RunPod key
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $THE_EDIT_RUNPOD_API_KEY" https://rest.runpod.io/v1/endpoints/5e875em8me1jff)
          echo "RunPod GET /v1/endpoints/5e875em8me1jff: $code"
          [ "$code" = 200 ]
      - name: Upload secrets
        run: |
          umask 077
          jq -n '{PADDLE_ENVIRONMENT:"sandbox", THE_EDIT_PAYMENT_PROVIDER:"paddle",
                  PADDLE_API_KEY:env.PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET:env.PADDLE_WEBHOOK_SECRET,
                  PADDLE_PRICE_THE_EDIT_4:env.PADDLE_PRICE_THE_EDIT_4, THE_EDIT_RUNPOD_API_KEY:env.THE_EDIT_RUNPOD_API_KEY}' > secrets.json
          node -e "const d=require('./secrets.json');console.log('names:',Object.keys(d).sort().join(', '))"
          npx --yes wrangler@4.136.3 secret bulk secrets.json --name hsc
          rm -f secrets.json
      - name: List Worker secret names
        run: npx --yes wrangler@4.136.3 secret list --name hsc | jq -r '.[].name' | sort
