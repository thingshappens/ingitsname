name: Set Worker secrets (one-off)

# Diagnostic: start Voicebox on The Edit's RunPod endpoint via list_profiles (no audio, no cost beyond seconds). Changes nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - env:
          RP: ${{ secrets.THE_EDIT_RUNPOD_API_KEY }}
        run: |
          RP=$(printf %s "$RP" | tr -d '[:space:]')
          for n in 1 2 3; do
            t=$(date +%s)
            r=$(curl -s --max-time 400 -X POST -H "Authorization: Bearer $RP" -H 'content-type: application/json' -d '{"input":{"action":"list_profiles"}}' https://api.runpod.ai/v2/5e875em8me1jff/runsync)
            echo "TRY $n ($(( $(date +%s)-t ))s): $(echo "$r" | jq -c '{status,workerId,out:(.output|tostring|.[0:200]),err:((.error//"")|tostring|.[-700:])}')"
          done
          echo "HEALTH $(curl -s -H "Authorization: Bearer $RP" https://api.runpod.ai/v2/5e875em8me1jff/health)"
