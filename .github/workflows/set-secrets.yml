name: Set Worker secrets (one-off)

# Diagnostic: reproduce The Edit's live Paddle transaction request and print Paddle's error. No payment.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce live checkout request
        env:
          K: ${{ secrets.PADDLE_API_KEY }}
          P: ${{ secrets.PADDLE_PRICE_THE_EDIT_4 }}
        run: |
          K=$(printf %s "$K" | tr -d '[:space:]'); P=$(printf %s "$P" | tr -d '[:space:]')
          for u in "https://hautesoundcouture.com/edit/?order=diag#access=diag" none; do
            if [ "$u" = none ]; then body=$(jq -n --arg p "$P" '{items:[{price_id:$p,quantity:1}],custom_data:{product:"diag"}}'); else body=$(jq -n --arg p "$P" --arg u "$u" '{items:[{price_id:$p,quantity:1}],custom_data:{product:"diag"},checkout:{url:$u}}'); fi
            r=$(curl -s -X POST -H "Authorization: Bearer $K" -H 'content-type: application/json' -d "$body" https://api.paddle.com/transactions)
            echo "with url=$u -> $(echo "$r" | jq -c '{error:.error, id:.data.id, status:.data.status, has_checkout_url:(.data.checkout.url!=null)}')"
          done
