name: Set Worker secrets (one-off)

# Diagnostic only: why Paddle SANDBOX webhooks fail. Prints shapes and status codes, never values. Sets nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
      PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
      TXN: txn_01m3cddj85zxc7syd12p6a0tp2
    steps:
      - name: Diagnose webhook
        run: |
          s="$PADDLE_WEBHOOK_SECRET"
          echo "webhook secret shape: length=${#s} prefix=$(printf %s "$s" | sed -E 's/^([a-z]+_[a-z]+_).*/\1/;t;s/^([a-z]+_).*/\1/;t;s/.*/(none)/') has_whitespace=$(printf %s "$s" | grep -q '[[:space:]]' && echo yes || echo no)"
          curl -sg -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/notifications?transaction_id=$TXN&per_page=20" > n.json
          id=$(jq -r '[.data[]|select(.type=="transaction.paid")][0].id' n.json)
          curl -sg -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/notifications/$id/logs" | jq -r '.data[] | "\(.attempted_at) code=\(.response_code) body=\(.response_body[0:120])"'
          rm -f n.json
