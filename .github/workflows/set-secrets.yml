name: Set Worker secrets (one-off)

# Manual only. Opens The Edit for owner-gated sandbox testing on the "hsc" Worker
# (the Cloudflare account CLOUDFLARE_API_TOKEN deploys to). Sets exactly two
# non-secret values; touches nothing else. Prints names only.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload secrets
        run: |
          jq -n '{THE_EDIT_ENABLED:"true", THE_EDIT_QA_APPROVED_VERSION:"edit-v10-monsieur-four-cuts-contract"}' > secrets.json
          node -e "const d=require('./secrets.json');console.log('names:',Object.keys(d).sort().join(', '))"
          npx --yes wrangler@4.136.3 secret bulk secrets.json --name hsc
          rm -f secrets.json
