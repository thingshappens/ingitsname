name: Set Worker secrets (one-off)

# Diagnostic: are the Atelier price IDs live prices? Also live-checkout probe. Changes nothing, prints no values.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.PADDLE_API_KEY }}
          P: ${{ secrets.PADDLE_PRICE_THE_EDIT_4 }}
          BULK: ${{ secrets.HSC_BULK_SECRETS }}
        run: |
          K=$(printf %s "$K" | tr -d '[:space:]'); P=$(printf %s "$P" | tr -d '[:space:]')
          echo "BULK keys: $(printf %s "$BULK" | jq -r 'keys|map(select(test("PADDLE|ATELIER|PROVIDER")))|join(",")')"
          echo "ATELIER_PAYMENT_PROVIDER=$(printf %s "$BULK" | jq -r '.ATELIER_PAYMENT_PROVIDER // "unset"')"
          for n in PADDLE_PRICE_ATELIER_4 PADDLE_PRICE_ATELIER_PACK; do
            id=$(printf %s "$BULK" | jq -r --arg n $n '.[$n] // ""' | tr -d '[:space:]')
            [ -z "$id" ] && { echo "$n: not in bulk"; continue; }
            echo "$n: live=$(curl -s -H "Authorization: Bearer $K" https://api.paddle.com/prices/$id | jq -c '{status:.data.status,amount:.data.unit_price.amount,cur:.data.unit_price.currency_code,name:.data.description,err:.error.code}')"
          done
          r=$(curl -s -X POST -H "Authorization: Bearer $K" -H 'content-type: application/json' -d "$(jq -n --arg p "$P" '{items:[{price_id:$p,quantity:1}],custom_data:{product:"diag"}}')" https://api.paddle.com/transactions)
          echo "with url=none -> $(echo "$r" | jq -c '{error:.error.code, id:.data.id}')"
          echo "LIVE PRICES:"; curl -s -H "Authorization: Bearer $K" 'https://api.paddle.com/prices?status=active&per_page=50' | jq -r '.data[] | "  \(.id) | \(.description) | \(.unit_price.amount) \(.unit_price.currency_code) | \(.billing_cycle) | product \(.product_id)"'
