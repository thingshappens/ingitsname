name: Set Worker secrets (one-off)

# Manual only. Copies the JSON in the HSC_BULK_SECRETS repo secret onto the
# "hsc" Worker in the Cloudflare account that serves hautesoundcouture.com
# (the same account CLOUDFLARE_API_TOKEN deploys to). Prints names only.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BULK: ${{ secrets.HSC_BULK_SECRETS }}
        run: |
          umask 077
          printenv BULK > secrets.json
          node -e "const d=require('./secrets.json');console.log('names:',Object.keys(d).sort().join(', '))"
          npx --yes wrangler@4.136.3 secret bulk secrets.json --name hsc
          rm -f secrets.json
