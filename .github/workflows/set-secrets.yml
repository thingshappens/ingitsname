name: Set Worker secrets (one-off)

# Manual only. Copies the Paddle SANDBOX webhook destination's secret key (read via the
# sandbox API) onto the "hsc" Worker as PADDLE_WEBHOOK_SECRET, replays the paid order's
# webhooks, and follows the order. Prints names and statuses only, never values.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
      DEST: https://hautesoundcouture.com/api/the-edit-webhook
      TXN: txn_01m3cddj85zxc7syd12p6a0tp2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set PADDLE_WEBHOOK_SECRET from Paddle sandbox
        run: |
          umask 077
          curl -sg -H "Authorization: Bearer $PADDLE_API_KEY" https://sandbox-api.paddle.com/notification-settings > ns.json
          key=$(jq -r --arg d "$DEST" '[.data[]|select(.destination==$d and .active)][0].endpoint_secret_key // empty' ns.json); rm -f ns.json
          echo "::add-mask::$key"
          case "$key" in pdl_ntfset_*) echo "secret key found (pdl_ntfset_…)";; *) echo "no pdl_ntfset_ secret key for $DEST"; exit 1;; esac
          jq -n --arg k "$key" '{PADDLE_WEBHOOK_SECRET:$k}' > secrets.json
          npx --yes wrangler@4.136.3 secret bulk secrets.json --name hsc
          rm -f secrets.json
      - name: Replay webhooks and follow order
        run: |
          sleep 20
          curl -sg -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/notifications?transaction_id=$TXN&per_page=20" > n.json
          for t in transaction.paid transaction.completed; do
            id=$(jq -r --arg t "$t" '[.data[]|select(.type==$t)][0].id' n.json)
            echo "replay $t: $(curl -sg -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/notifications/$id/replay")"
          done
          rm -f n.json
          url=$(curl -sg -H "Authorization: Bearer $PADDLE_API_KEY" "https://sandbox-api.paddle.com/transactions/$TXN" | jq -r '.data.checkout.url')
          order=$(printf %s "$url" | sed -nE 's/.*order=([0-9a-f-]{36}).*/\1/p'); access=$(printf %s "$url" | sed -nE 's/.*access=([0-9a-f]+).*/\1/p')
          echo "::add-mask::$access"
          for i in $(seq 1 30); do
            sleep 30
            curl -s -X POST 'https://hautesoundcouture.com/api/the-edit?action=status' -H 'content-type: application/json' -d "{\"orderId\":\"$order\",\"accessToken\":\"$access\"}" > s.json
            echo "$(date -u +%H:%M:%S) $(jq -c '{status,error,cuts:[.cuts[]?|.renderStatus]}' s.json)"
            s=$(jq -r .status s.json); if [ "$s" = ready ] || [ "$s" = failed ]; then break; fi
          done
          if [ "$s" = ready ]; then
            cut=$(jq -r '.cuts[0].id' s.json)
            curl -s -o cut.wav -w "download cut 1: %{http_code} %{size_download} bytes %{content_type}\n" -X POST 'https://hautesoundcouture.com/api/the-edit?action=download' -H 'content-type: application/json' -d "{\"orderId\":\"$order\",\"accessToken\":\"$access\",\"cutId\":\"$cut\"}"
            rm -f cut.wav
          fi
          rm -f s.json
