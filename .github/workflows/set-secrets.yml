name: Set Worker secrets (one-off)

# Live smoke test only: public visitor reaches Paddle LIVE checkout for The Edit. Sets nothing, pays nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
      - run: mkdir -p shots && node scripts/e2e-live-open.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
