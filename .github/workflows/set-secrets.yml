name: Set Worker secrets (one-off)

# Diagnostic: inspect The Edit's RunPod endpoint. Changes nothing.
on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - env:
          RP: ${{ secrets.THE_EDIT_RUNPOD_API_KEY }}
        run: |
          RP=$(printf %s "$RP" | tr -d '[:space:]')
          curl -s -H "Authorization: Bearer $RP" 'https://rest.runpod.io/v1/endpoints/5e875em8me1jff?includeWorkers=true&includeTemplate=true' | jq -c 'del(.template.env) + {envKeys:(.template.env|keys?)}' | sed 's/^/EP /'
